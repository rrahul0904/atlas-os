name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas_ci
          POSTGRES_PASSWORD: atlas_ci
          POSTGRES_DB: atlas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas_ci -d atlas_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://atlas_ci:atlas_ci@127.0.0.1:5432/atlas_ci
      ATLAS_AUTH_SECRET: atlas-ci-auth-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Verify upgrade from previous production schema
        run: npm run db:upgrade-check
      - name: Apply versioned AtlasOS migrations
        run: npm run db:migrate
      - name: Verify canonical database contract
        run: npm run db:check
      - run: npm run verify
